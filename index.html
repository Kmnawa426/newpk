<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance System Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero-shell">
      <div class="hero-copy">
        <div class="college-photo" role="img" aria-label="College campus building"></div>
        <span class="eyebrow">Smart Attendance Workspace</span>
        <h1>College Attendance System</h1>
        <p class="muted">A cleaner experience for admins, teachers, and students with focused panels, quick actions, and less clutter.</p>
      </div>

      <section class="card auth-card">
        <div class="auth-header">
          <h2>Login</h2>
          <p class="muted">Choose your role and continue to your workspace.</p>
        </div>

        <label for="role">Role</label>
        <select id="role">
          <option value="admin">Admin</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
        </select>

        <label for="email" id="emailLabel">Email</label>
        <input type="email" id="email" placeholder="Enter your admin email">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <button id="loginBtn" class="primary">Login</button>

        <div class="auth-links">
          <a href="register.html">Create Student Account</a>
        </div>

        <p class="hint" id="loginHint">Admins login with their Supabase email and password.</p>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="session.js"></script>
  <script src="utils.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
</body>
</html>
